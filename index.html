<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DnD World Clock & Engine</title>
    <style>
        /* ==========================================================================
           HEADER: STYLING & VISUAL LAYOUT
           Instructions: You can change colors (hex codes like #2c3e50), font sizes,
           and padding here to match your campaign notebook theme.
           ========================================================================== */
        body {
            font-family: 'Georgia', serif;
            background-color: #1a1a1d;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .clock-container {
            background-color: #2c2c34;
            border: 2px solid #8b0000; /* Dark red border */
            border-radius: 10px;
            padding: 25px;
            width: 450px;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
        }
        h2 {
            text-align: center;
            color: #d4af37; /* Metallic gold color */
            margin-top: 0;
            border-bottom: 1px solid #8b0000;
            padding-bottom: 10px;
        }
        .clock-row {
            margin: 12px 0;
            font-size: 1.1em;
            display: flex;
            justify-content: space-between;
        }
        .label {
            font-weight: bold;
            color: #a9a9a9;
        }
        .value {
            color: #ffffff;
            font-weight: bold;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: #8b0000;
            color: #ffffff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #a50000;
        }
    </style>
</head>
<body>

<div class="clock-container">
    <h2>⌛ Worldstate Clock</h2>

    <!-- DISPLAY FIELDS (Automatically updated by JavaScript) -->
    <div class="clock-row">
        <span class="label">Campaign / Zone:</span>
        <span class="value" id="display-region">--</span>
    </div>
    <div class="clock-row">
        <span class="label">Calendar Year:</span>
        <span class="value" id="display-year">--</span>
    </div>
    <div class="clock-row">
        <span class="label">Time of Day:</span>
        <span class="value" id="display-time">--</span>
    </div>
    <div class="clock-row">
        <span class="label">Weather Pattern:</span>
        <span class="value" id="display-weather">--</span>
    </div>
    <div class="clock-row">
        <span class="label">Active Plane Phase:</span>
        <span class="value" id="display-plane">--</span>
    </div>
    <div class="clock-row">
        <span class="label">Turn Counter:</span>
        <span class="value" id="display-turn">--</span>
    </div>

    <!-- BUTTON CONTROLS -->
    <div class="controls">
        <button onclick="advanceTurns(1)">+1 Turn</button>
        <button onclick="advanceTurns(3)">+3 Turns (Check Weather)</button>
        <button onclick="advanceTurns(10)">+10 Turns</button>
    </div>
</div>

<script>
    /* ==========================================================================
       HEADER 1: WORLD CONFIGURATION & STARTING STATE
       Instructions: EDIT the values inside the quotes below to set your starting
       campaign location, date, starting turn number, and active plane.
       ========================================================================== */
    let currentRegion = "Nytheris (Vehl'Torath Wastes)"; // OPTIONS: "Nytheris", "Thelara", "Sword Coast"
    let currentYear   = "1492 DR";                      // Your starting year / era
    let currentTurn   = 1;                              // Turn counter baseline
    let currentPlane  = "Material Plane (Normal)";      // Current planar alignment state

    /* ==========================================================================
       HEADER 2: TIME OF DAY CYCLE
       Instructions: These are the daily time steps. You can add, edit, or rename
       these stages (e.g., change "Dawn" to "Blood Dawn").
       ========================================================================== */
    const timeOfDayCycle = [
        "Dawn", 
        "Morning", 
        "Noon", 
        "Afternoon", 
        "Dusk", 
        "Midnight"
    ];
    let timeIndex = 0; // Starts at "Dawn" (index 0)

    /* ==========================================================================
       HEADER 3: WEATHER RANDOMIZER TABLES
       Instructions: Add or remove weather types in quotes for each region.
       Separate items with commas.
       ========================================================================== */
    const weatherTables = {
        "Nytheris": [
            "Time-Sick Ash-Storm", 
            "Eerie Arcane Fog", 
            "Clear with Humming Blizzards", 
            "Memory-Distorting Gale"
        ],
        "Thelara": [
            "Mild Sunny Clear", 
            "Overcast with Dragon-Sight Shadows", 
            "Heavy Downpour", 
            "Unnatural Warm Breeze"
        ],
        "Sword Coast": [
            "Chilly Sea Mist", 
            "Crisp Autumn Sky", 
            "Drizzling Rain", 
            "Howling Coastal Wind"
        ]
    };

    /* ==========================================================================
       HEADER 4: ENGINE LOGIC (DO NOT CHANGE UNLESS modifying mechanic rules)
       Instructions: This logic automatically updates weather every 3 turns and
       cycles through the time-of-day phases.
       ========================================================================== */
    let currentWeather = weatherTables[currentRegion][0];

    function updateClockDisplay() {
        document.getElementById('display-region').innerText  = currentRegion;
        document.getElementById('display-year').innerText    = currentYear;
        document.getElementById('display-time').innerText    = timeOfDayCycle[timeIndex];
        document.getElementById('display-weather').innerText = currentWeather;
        document.getElementById('display-plane').innerText   = currentPlane;
        document.getElementById('display-turn').innerText    = currentTurn;
    }

    function advanceTurns(numTurns) {
        for (let i = 0; i < numTurns; i++) {
            currentTurn++;
            
            // Advance time of day every turn
            timeIndex = (timeIndex + 1) % timeOfDayCycle.length;

            // Update weather pattern every 3 turns (per Worldstate Ledger rules)
            if (currentTurn % 3 === 0) {
                let options = weatherTables[currentRegion] || weatherTables["Nytheris"];
                currentWeather = options[Math.floor(Math.random() * options.length)];
            }
        }
        updateClockDisplay();
    }

    // Initialize clock display on load
    updateClockDisplay();
</script>

</body>
</html>
